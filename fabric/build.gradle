plugins {
	id 'dev.architectury.loom'
	id 'maven-publish'
}

repositories {
	maven { url = 'https://maven.parchmentmc.org'
		content { includeGroup('org.parchmentmc.data') }
	}
	maven { url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroupAndSubgroups("com.terraformersmc") }
	}
	maven { url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
}

configurations {
	commonJava {
		canBeResolved = true
	}
	commonResources {
		canBeResolved = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		if (project.parchment_version.size() > 0) {
			parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
		}
	}
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"

	modImplementation(fabricApi.module("fabric-api-base", project.fabric_api_version))
	modImplementation(fabricApi.module("fabric-command-api-v2", project.fabric_api_version))
	include(fabricApi.module("fabric-api-base", project.fabric_api_version))
	include(fabricApi.module("fabric-command-api-v2", project.fabric_api_version))

	modImplementation(include("me.fallenbreath:conditional-mixin-fabric:${project.conditionalmixin_version}"))
	modCompileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// optional mod compat, compile only
	modCompileOnly files("${rootProject.projectDir}/libs/${project.malilib_fabric_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.tweakeroo_fabric_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.itemscroller_fabric_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.litematica_fabric_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.minihud_fabric_file}")

	commonJava project(path: ':common', configuration: 'commonJava')
	commonResources project(path: ':common', configuration: 'commonResources')
}

// Compile common sources directly with the same mappings (single remap pass)
tasks.named('compileJava', JavaCompile) {
	dependsOn(configurations.commonJava)
	source(configurations.commonJava)
}

base {
	group = project.group + "." + project.mod_id
	archivesName = "tweakermore-fabric-${project.minecraft_version_out}"
	version = project.mod_version
	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
	accessWidenerPath = file("src/main/resources/tweakermore.accesswidener")

	mixin {
		useLegacyMixinAp = true
		defaultRefmapName.set("tweakermore-refmap.json")
	}
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(configurations.commonResources) {
		exclude '**/tweakermore.accesswidener'
		exclude '**/*.xcf'
		exclude '**/xcf'
	}
	inputs.property "mod_version", project.mod_version
	filesMatching("fabric.mod.json") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${base.archivesName}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}

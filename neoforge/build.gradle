plugins {
	id 'dev.architectury.loom'
	id 'maven-publish'
}

repositories {
	maven { url = 'https://maven.parchmentmc.org'
		content { includeGroup('org.parchmentmc.data') }
	}
	maven { url = 'https://maven.neoforged.net/releases' }
	maven { url = 'https://maven.fallenbreath.me/releases'
		content { includeGroupAndSubgroups("me.fallenbreath") }
	}
}

configurations {
	commonJava {
		canBeResolved = true
	}
	commonResources {
		canBeResolved = true
	}
	jarJarMod {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		if (project.parchment_version.size() > 0) {
			parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
		}
	}
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	implementation "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "org.jetbrains:annotations:24.1.0"

	modCompileOnly "me.fallenbreath:conditional-mixin-neoforge:${project.conditionalmixin_version}"
	jarJarMod "me.fallenbreath:conditional-mixin-neoforge:${project.conditionalmixin_version}"

	// optional mod compat, compile only
	modCompileOnly files("${rootProject.projectDir}/libs/${project.malilib_neoforge_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.tweakeroo_neoforge_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.itemscroller_neoforge_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.litematica_neoforge_file}")
	modCompileOnly files("${rootProject.projectDir}/libs/${project.minihud_neoforge_file}")

	commonJava project(path: ':common', configuration: 'commonJava')
	commonResources project(path: ':common', configuration: 'commonResources')
}

// NeoForge は Mojang 名で動くので、upstream の remap=false な lambda 参照
// (Yarn intermediary 名) を Mojang 名に差し替えてから共通ソースをコンパイルする
def patchedCommonDir = layout.buildDirectory.dir('generated/commonJavaForNeoForge')

tasks.register('patchCommonSourcesForNeoForge', Copy) {
	dependsOn(configurations.commonJava)
	from({ configurations.commonJava.singleFile })
	into(patchedCommonDir)
	filesMatching('**/*.java') {
		filter { String line ->
			line.replace('"method_29338"', '"lambda$new$7"')
				.replace('"method_55440"', '"lambda$displayScoreboardSidebar$14"')
				.replace(
						'"Lnet/minecraft/world/entity/Entity;getPickResult()Lnet/minecraft/world/item/ItemStack;"',
						'"Lnet/minecraft/world/entity/Entity;getPickedResult(Lnet/minecraft/world/phys/HitResult;)Lnet/minecraft/world/item/ItemStack;"'
				)
		}
	}
	// NeoForge changed CropBlock#getGrowthSpeed to take a BlockState instead of a Block
	filesMatching('**/CropBlockAccessor.java') {
		filter { String line ->
			line.replace('import net.minecraft.world.level.BlockGetter;',
					'import net.minecraft.world.level.BlockGetter;\nimport net.minecraft.world.level.block.state.BlockState;')
				.replace('static float invokeGetAvailableMoisture(Block block, BlockGetter world, BlockPos pos)',
						'static float invokeGetAvailableMoisture(BlockState block, BlockGetter world, BlockPos pos)')
		}
	}
	filesMatching('**/CropGrowthSpeedRendererHandler.java') {
		filter { String line ->
			line.replace('invokeGetAvailableMoisture(cropBlock, world, pos)',
					'invokeGetAvailableMoisture(cropBlock.defaultBlockState(), world, pos)')
		}
	}
}

// Compile common sources directly with official mappings (single remap pass)
tasks.named('compileJava', JavaCompile) {
	dependsOn('patchCommonSourcesForNeoForge')
	source(patchedCommonDir)
}

base {
	group = project.group + "." + project.mod_id
	archivesName = "tweakermore-neoforge-${project.minecraft_version_out}"
	version = project.mod_version
	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
	accessWidenerPath = file("src/main/resources/tweakermore.accesswidener")
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(configurations.commonResources) {
		exclude '**/tweakermore.accesswidener'
		exclude '**/*.xcf'
		exclude '**/xcf'
	}
	inputs.property "mod_version", project.mod_version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${base.archivesName}" }
	}
	// bundle conditional-mixin-neoforge as a nested jar (NeoForge jar-in-jar)
	from(configurations.jarJarMod) {
		into 'META-INF/jarjar'
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java
		}
	}
	repositories {
		maven {
			url = "${rootProject.projectDir}/CommonMaven"
		}
	}
}

apply from: rootProject.file('gradle/patch-neoforge-mixins.gradle')
